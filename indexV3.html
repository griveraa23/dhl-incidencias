<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHL Workforce Planning</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --dhl-red:#D40511;
    --dhl-yellow:#FFCC00;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:var(--dhl-yellow);
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

header h1{
    color:var(--dhl-red);
}

.datetime{
    font-weight:bold;
}

.container{
    max-width:1800px;
    margin:auto;
    padding:20px;
}

.top-buttons{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.top-buttons button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    background:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.top-buttons button.active{
    background:var(--dhl-red);
    color:white;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.filters select,
.filters input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
}

.quick-filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.quick-btn{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#eee;
    cursor:pointer;
    font-weight:bold;
}

.quick-btn.active{
    background:var(--dhl-red);
    color:white;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:20px;
    border-left:8px solid var(--dhl-red);
    cursor:pointer;
}

.kpi.active{
    background:var(--dhl-red);
    color:white;
}

.kpi.active .kpi-number{
    color:white;
}

.kpi-number{
    font-size:38px;
    font-weight:bold;
    color:var(--dhl-red);
}

.selector-group{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin:20px 0;
}

.selector{
    padding:15px 20px;
    border-radius:15px;
    border:2px solid #ccc;
    background:white;
    cursor:pointer;
    font-weight:bold;
}

.selector.active{
    background:var(--dhl-red);
    color:white;
    border-color:var(--dhl-red);
}

.position-block{
    background:#fafafa;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

.position-header{
    display:flex;
    gap:20px;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.incidents-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.incident-card{
    background:white;
    padding:15px;
    border-radius:15px;
}

.counter{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin-top:10px;
}

.counter button{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

.plus{
    background:var(--dhl-yellow);
}

.minus{
    background:#ffdede;
    color:var(--dhl-red);
}

.count{
    font-size:24px;
    font-weight:bold;
}

.add-position-btn{
    padding:15px 20px;
    border:none;
    border-radius:12px;
    background:var(--dhl-yellow);
    cursor:pointer;
    font-weight:bold;
}

.submit-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:var(--dhl-red);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.remove-btn{
    background:#ffe1e1;
    color:var(--dhl-red);
    border:none;
    padding:12px 15px;
    border-radius:10px;
    cursor:pointer;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table th,
.history-table td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--dhl-red);
    color:white;
    padding:15px 25px;
    border-radius:12px;
    display:none;
}

@media(max-width:900px){

    .report-layout{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <h1>📦 DHL Workforce Planning</h1>

    <div class="datetime">
        <div id="date"></div>
        <div id="time"></div>
    </div>

</header>

<div class="container">

    <div class="top-buttons">

        <button id="dashboardBtn" class="active">
            📊 Dashboard
        </button>

        <button id="reportBtn">
            📝 Programar
        </button>

    </div>

    <!-- DASHBOARD -->

    <div id="dashboardPage" class="page active">

        <div class="card">

            <div class="filters">

                <div>
                    <label>Nave</label>
                    <select id="warehouseFilter"></select>
                </div>

                <div>
                    <label>Turno</label>
                    <select id="shiftFilter">
                        <option value="all">Todos</option>
                        <option value="Primero">Primero</option>
                        <option value="Segundo">Segundo</option>
                        <option value="Tercero">Tercero</option>
                    </select>
                </div>

                <div>
                    <label>Fecha Inicio</label>
                    <input type="date" id="startDate">
                </div>

                <div>
                    <label>Fecha Fin</label>
                    <input type="date" id="endDate">
                </div>

            </div>

        </div>

        <div class="kpis" id="dynamicKpis"></div>

        <div class="card">

            <h2>📈 Incidencias</h2>

            <br>

            <canvas id="lineChart"></canvas>

        </div>

        <div class="card">

            <h2>🏭 Incidencias por Nave</h2>

            <br>

            <canvas id="barChart"></canvas>

        </div>

    </div>

</div>

<div class="toast" id="toast">
    Guardado correctamente
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBpiI6tgL25Ssrt57n_9rxZJoTa9y0KC5g",
  authDomain: "dhl-incidencias.firebaseapp.com",
  projectId: "dhl-incidencias",
  storageBucket: "dhl-incidencias.firebasestorage.app",
  messagingSenderId: "592376274380",
  appId: "1:592376274380:web:dee72b1b5c8fe5a6141169",
  measurementId: "G-L8WWCG2QMZ"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const warehouses = [
"Nave 1","Nave 4","Nave 26","Nave 52",
"Nave 84","Nave 82","Nave 101","Nave 109",
"Forvia/HBPO","Mtto MHE","Falcon","Transportes"
];

const incidents = [
"Vacante",
"Capacitación",
"Ausentismo",
"Incapacidad",
"Castigo",
"Permiso sin goce",
"Permiso con goce",
"Vacaciones",
"Producción",
"Llenado de proceso",
"Llenado de proceso (PAGADO)",
"Actividades especiales VW",
"Atraso ruta transporte",
"Actividades especiales DHL",
"Talleres / Cursos",
"Sindicato"
];

let reports=[];
let activeIncident=null;

function updateClock(){

    const now=new Date();

    document.getElementById("date")
        .innerText=now.toLocaleDateString();

    document.getElementById("time")
        .innerText=now.toLocaleTimeString();

}

setInterval(updateClock,1000);

updateClock();

const warehouseFilter =
    document.getElementById("warehouseFilter");

warehouseFilter.innerHTML =
    `<option value="all">Todas</option>`;

warehouses.forEach(w=>{

    warehouseFilter.innerHTML += `
        <option value="${w}">
            ${w}
        </option>
    `;

});

const lineChart=new Chart(
    document.getElementById("lineChart"),
    {
        type:"bar",
        data:{
            labels:incidents,
            datasets:[{
                label:"Incidencias",
                data:new Array(incidents.length).fill(0),
                backgroundColor:"#D40511"
            }]
        }
    }
);

const barChart=new Chart(
    document.getElementById("barChart"),
    {
        type:"bar",
        data:{
            labels:warehouses,
            datasets:[{
                label:"Totales",
                data:new Array(warehouses.length).fill(0),
                backgroundColor:"#FFCC00"
            }]
        }
    }
);

function filterReports(data){

    const warehouseFilter =
        document.getElementById("warehouseFilter").value;

    const shiftFilter =
        document.getElementById("shiftFilter").value;

    const startDate =
        new Date(
            document.getElementById("startDate").value
        );

    const endDate =
        new Date(
            document.getElementById("endDate").value
        );

    endDate.setHours(23,59,59,999);

    return data.filter(r=>{

        let reportDate;

        // FORMATO NUEVO
        // 2026-05-20

        if(
            r.scheduledDate &&
            r.scheduledDate.includes("-")
        ){

            reportDate =
                new Date(
                    r.scheduledDate + "T00:00:00"
                );

        }

        // FORMATO VIEJO
        // 5/19/2026

        else if(
            r.scheduledDate &&
            r.scheduledDate.includes("/")
        ){

            const parts =
                r.scheduledDate.split("/");

            reportDate = new Date(

                parseInt(parts[2]),
                parseInt(parts[0]) - 1,
                parseInt(parts[1])

            );

        }

        else{

            reportDate =
                new Date(r.scheduledDate);

        }

        const warehouseMatch =

            warehouseFilter === "all" ||

            r.warehouse === warehouseFilter;

        const shiftMatch =

            shiftFilter === "all" ||

            r.shift === shiftFilter;

        const dateMatch =

            reportDate >= startDate &&

            reportDate <= endDate;

        return (

            warehouseMatch &&
            shiftMatch &&
            dateMatch

        );

    });

}

function renderDynamicKpis(total,incidentTotals){

    const container =
        document.getElementById("dynamicKpis");

    container.innerHTML="";

    container.innerHTML += `

        <div class="kpi">

            <h3>Total Programado</h3>

            <div class="kpi-number">
                ${total}
            </div>

        </div>

    `;

    Object.entries(incidentTotals)

        .filter(([k,v])=>v>0)

        .sort((a,b)=>b[1]-a[1])

        .forEach(item=>{

            container.innerHTML += `

                <div class="kpi">

                    <h3>${item[0]}</h3>

                    <div class="kpi-number">
                        ${item[1]}
                    </div>

                </div>

            `;

        });

}

function updateDashboard(data){

    const filtered =
        filterReports(data);

    let total=0;

    const incidentTotals={};

    incidents.forEach(i=>{
        incidentTotals[i]=0;
    });

    const warehouseTotals={};

    warehouses.forEach(w=>{
        warehouseTotals[w]=0;
    });

    filtered.forEach(r=>{

        let reportTotal=0;

        if(r.positions){

            r.positions.forEach(p=>{

                incidents.forEach(i=>{

                    const value =
                        p.incidents?.[i] || 0;

                    incidentTotals[i]+=value;

                    reportTotal+=value;

                });

            });

        }

        total+=reportTotal;

        warehouseTotals[r.warehouse]+=reportTotal;

    });

    renderDynamicKpis(
        total,
        incidentTotals
    );

    lineChart.data.datasets[0].data =
        incidents.map(i=>incidentTotals[i]);

    lineChart.update();

    barChart.data.datasets[0].data =
        warehouses.map(w=>warehouseTotals[w]);

    barChart.update();

}

function loadReports(){

    onSnapshot(collection(db,"reports"),snapshot=>{

        reports=[];

        snapshot.forEach(doc=>{

            reports.push(doc.data());

        });

        updateDashboard(reports);

    });

}

document
    .getElementById("warehouseFilter")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("shiftFilter")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("startDate")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("endDate")
    .addEventListener("change",()=>updateDashboard(reports));

const today=new Date();

document.getElementById("startDate").value =
    today.toISOString().split("T")[0];

document.getElementById("endDate").value =
    today.toISOString().split("T")[0];

loadReports();

</script>

</body>
</html>
