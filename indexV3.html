<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHL Workforce Analytics V3</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --dhl-red:#D40511;
    --dhl-yellow:#FFCC00;
    --bg:#f5f5f5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--bg);
    color:#222;
}

header{
    background:var(--dhl-yellow);
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

header h1{
    color:var(--dhl-red);
}

.datetime{
    font-weight:bold;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:20px;
}

.top-buttons{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.top-buttons button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:white;
}

.top-buttons button.active{
    background:var(--dhl-red);
    color:white;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

select,
input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.kpi{
    background:white;
    border-radius:20px;
    padding:20px;
    border-left:8px solid var(--dhl-red);
}

.kpi-number{
    font-size:38px;
    color:var(--dhl-red);
    font-weight:bold;
}

.record-card{
    background:#fafafa;
    border-radius:18px;
    padding:20px;
    margin-top:20px;
    border:2px solid #eee;
}

.record-grid{
    display:grid;
    grid-template-columns:2fr 2fr 1fr auto;
    gap:15px;
    align-items:end;
}

.counter{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.counter button{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.plus{
    background:var(--dhl-yellow);
}

.minus{
    background:#ffd6d6;
    color:var(--dhl-red);
}

.count{
    font-size:24px;
    font-weight:bold;
    min-width:30px;
    text-align:center;
}

.add-btn{
    background:var(--dhl-yellow);
    border:none;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.delete-btn{
    background:var(--dhl-red);
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.submit-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:var(--dhl-red);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table th,
.history-table td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--dhl-red);
    color:white;
    padding:15px 25px;
    border-radius:12px;
    display:none;
}

.summary-box{
    background:#fafafa;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

@media(max-width:900px){

    .record-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <h1>📦 DHL Workforce Analytics V3</h1>

    <div class="datetime">
        <div id="date"></div>
        <div id="time"></div>
    </div>

</header>

<div class="container">

    <div class="top-buttons">

        <button id="dashboardBtn" class="active">
            📊 Dashboard
        </button>

        <button id="reportBtn">
            📝 Reportar
        </button>

    </div>

    <!-- DASHBOARD -->

    <div id="dashboardPage" class="page active">

        <div class="card">

            <div class="filters">

                <div>
                    <label>Nave</label>
                    <select id="warehouseFilter"></select>
                </div>

                <div>
                    <label>Turno</label>
                    <select id="shiftFilter">
                        <option value="all">Todos</option>
                        <option value="Primero">Primero</option>
                        <option value="Segundo">Segundo</option>
                        <option value="Tercero">Tercero</option>
                    </select>
                </div>

                <div>
                    <label>Periodo</label>
                    <select id="dateFilter">
                        <option value="today">Hoy</option>
                        <option value="yesterday">Ayer</option>
                        <option value="week">Semana</option>
                        <option value="month">Mes</option>
                        <option value="3months">Últimos 3 Meses</option>
                    </select>
                </div>

            </div>

        </div>

        <div class="kpis">

            <div class="kpi">
                <h3>Total Incidencias</h3>
                <div class="kpi-number" id="kpiTotal">0</div>
            </div>

            <div class="kpi">
                <h3>Vacaciones</h3>
                <div class="kpi-number" id="kpiVacaciones">0</div>
            </div>

            <div class="kpi">
                <h3>Incapacidades</h3>
                <div class="kpi-number" id="kpiIncapacidad">0</div>
            </div>

            <div class="kpi">
                <h3>Vacantes</h3>
                <div class="kpi-number" id="kpiVacante">0</div>
            </div>

        </div>

        <div class="card">

            <h2>📈 Incidencias</h2>

            <canvas id="lineChart"></canvas>

        </div>

        <div class="card">

            <h2>🏭 Incidencias por Nave</h2>

            <canvas id="barChart"></canvas>

        </div>

    </div>

    <!-- REPORTAR -->

    <div id="reportPage" class="page">

        <div class="card">

            <h2>📝 Captura de Incidencias</h2>

            <br>

            <label>Usuario</label>

            <input type="text" id="username" placeholder="Ejemplo: Memo">

            <br><br>

            <label>Nave</label>

            <select id="warehouseSelect"></select>

            <br><br>

            <label>Turno</label>

            <select id="shiftSelect">

                <option value="">Selecciona</option>
                <option value="Primero">Primero</option>
                <option value="Segundo">Segundo</option>
                <option value="Tercero">Tercero</option>

            </select>

            <div id="recordsContainer"></div>

            <button class="add-btn" onclick="addRecord()">
                ➕ Agregar otra incidencia
            </button>

            <div class="summary-box">

                <h3>📋 Resumen</h3>

                <br>

                <div id="summary"></div>

            </div>

            <button class="submit-btn" onclick="submitReport()">
                🚀 Enviar Reporte
            </button>

        </div>

        <div class="card">

            <h2>📚 Historial</h2>

            <br>

            <table class="history-table">

                <thead>

                    <tr>

                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Nave</th>
                        <th>Turno</th>
                        <th>Total</th>

                    </tr>

                </thead>

                <tbody id="historyTable"></tbody>

            </table>

        </div>

    </div>

</div>

<div class="toast" id="toast">
    Reporte enviado correctamente
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBpiI6tgL25Ssrt57n_9rxZJoTa9y0KC5g",
  authDomain: "dhl-incidencias.firebaseapp.com",
  projectId: "dhl-incidencias",
  storageBucket: "dhl-incidencias.firebasestorage.app",
  messagingSenderId: "592376274380",
  appId: "1:592376274380:web:dee72b1b5c8fe5a6141169",
  measurementId: "G-L8WWCG2QMZ"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const warehouses = [
    "Nave 1",
    "Nave 4",
    "Nave 26",
    "Nave 52",
    "Nave 84",
    "Nave 82",
    "Nave 101",
    "Nave 109",
    "Forvia/HBPO",
    "Mtto MHE",
    "Falcon",
    "Transportes"
];

const positions = [
    "Operario Flexible",
    "Tractorista",
    "Montacarguista",
    "Gruista",
    "Analista",
    "Coordinador"
];

const incidents = [
    "Vacaciones",
    "Permiso sin goce",
    "Permiso con goce",
    "Incapacidad",
    "Capacitación",
    "Castigo",
    "Plan de fin de semana",
    "Vacante"
];

const warehouseSelect =
    document.getElementById("warehouseSelect");

const warehouseFilter =
    document.getElementById("warehouseFilter");

warehouses.forEach(w=>{

    warehouseSelect.innerHTML += `
        <option value="${w}">
            ${w}
        </option>
    `;

    warehouseFilter.innerHTML += `
        <option value="${w}">
            ${w}
        </option>
    `;

});

warehouseFilter.innerHTML =
    `<option value="all">Todas</option>` +
    warehouseFilter.innerHTML;

function updateClock(){

    const now=new Date();

    document.getElementById("date")
        .innerText=now.toLocaleDateString();

    document.getElementById("time")
        .innerText=now.toLocaleTimeString();

}

setInterval(updateClock,1000);

updateClock();

const dashboardBtn =
    document.getElementById("dashboardBtn");

const reportBtn =
    document.getElementById("reportBtn");

const dashboardPage =
    document.getElementById("dashboardPage");

const reportPage =
    document.getElementById("reportPage");

dashboardBtn.onclick=()=>{

    dashboardBtn.classList.add("active");
    reportBtn.classList.remove("active");

    dashboardPage.classList.add("active");
    reportPage.classList.remove("active");

};

reportBtn.onclick=()=>{

    reportBtn.classList.add("active");
    dashboardBtn.classList.remove("active");

    reportPage.classList.add("active");
    dashboardPage.classList.remove("active");

};

let records=[];

function addRecord(){

    const id=Date.now();

    records.push({
        id,
        position:"",
        incident:"",
        quantity:0
    });

    renderRecords();

}

window.addRecord=addRecord;

function renderRecords(){

    const container =
        document.getElementById("recordsContainer");

    container.innerHTML="";

    records.forEach((record,index)=>{

        const div=document.createElement("div");

        div.className="record-card";

        div.innerHTML=`

            <div class="record-grid">

                <div>

                    <label>Puesto</label>

                    <select onchange="updatePosition(${record.id},this.value)">

                        <option value="">Selecciona</option>

                        ${positions.map(p=>`
                            <option value="${p}"
                            ${record.position===p ? "selected":""}>
                                ${p}
                            </option>
                        `).join("")}

                    </select>

                </div>

                <div>

                    <label>Incidencia</label>

                    <select onchange="updateIncident(${record.id},this.value)">

                        <option value="">Selecciona</option>

                        ${incidents.map(i=>`
                            <option value="${i}"
                            ${record.incident===i ? "selected":""}>
                                ${i}
                            </option>
                        `).join("")}

                    </select>

                </div>

                <div>

                    <label>Cantidad</label>

                    <div class="counter">

                        <button class="minus"
                        onclick="changeQuantity(${record.id},-1)">
                            -
                        </button>

                        <div class="count">
                            ${record.quantity}
                        </div>

                        <button class="plus"
                        onclick="changeQuantity(${record.id},1)">
                            +
                        </button>

                    </div>

                </div>

                <div>

                    <button class="delete-btn"
                    onclick="removeRecord(${record.id})">
                        ✖
                    </button>

                </div>

            </div>

        `;

        container.appendChild(div);

    });

    updateSummary();

}

window.updatePosition=(id,value)=>{

    const r=records.find(x=>x.id===id);

    r.position=value;

    updateSummary();

};

window.updateIncident=(id,value)=>{

    const r=records.find(x=>x.id===id);

    r.incident=value;

    updateSummary();

};

window.changeQuantity=(id,delta)=>{

    const r=records.find(x=>x.id===id);

    r.quantity += delta;

    if(r.quantity<0){
        r.quantity=0;
    }

    renderRecords();

};

window.removeRecord=(id)=>{

    records =
        records.filter(r=>r.id!==id);

    renderRecords();

};

function updateSummary(){

    const summary =
        document.getElementById("summary");

    let total=0;

    let html="";

    records.forEach(r=>{

        total += r.quantity;

        html += `

            <div style="margin-bottom:10px;">

                <strong>${r.position || "-"}</strong>
                /
                ${r.incident || "-"}
                :
                ${r.quantity}

            </div>

        `;

    });

    html += `

        <hr><br>

        <strong>
            Total incidencias:
            ${total}
        </strong>

    `;

    summary.innerHTML=html;

}

addRecord();

async function submitReport(){

    const username =
        document.getElementById("username").value;

    const warehouse =
        document.getElementById("warehouseSelect").value;

    const shift =
        document.getElementById("shiftSelect").value;

    if(!username || !warehouse || !shift){

        alert("Completa los campos");

        return;

    }

    const validRecords =
        records.filter(r=>
            r.position &&
            r.incident &&
            r.quantity>0
        );

    if(validRecords.length===0){

        alert("Agrega incidencias");

        return;

    }

    const total =
        validRecords.reduce((a,b)=>
            a+b.quantity,0);

    const now=new Date();

    await addDoc(
        collection(db,"reports"),
        {

            username,
            warehouse,
            shift,
            records:validRecords,
            total,

            timestamp:Date.now(),

            date:now.toLocaleDateString(),
            time:now.toLocaleTimeString()

        }
    );

    document.getElementById("username").value="";
    document.getElementById("shiftSelect").value="";

    records=[];

    addRecord();

    showToast();

}

window.submitReport=submitReport;

function showToast(){

    const toast =
        document.getElementById("toast");

    toast.style.display="block";

    setTimeout(()=>{

        toast.style.display="none";

    },3000);

}

const lineChart = new Chart(

    document.getElementById("lineChart"),

    {

        type:"bar",

        data:{

            labels:incidents,

            datasets:[{

                label:"Incidencias",

                data:[],

                backgroundColor:"#D40511"

            }]

        }

    }

);

const barChart = new Chart(

    document.getElementById("barChart"),

    {

        type:"bar",

        data:{

            labels:warehouses,

            datasets:[{

                label:"Totales",

                data:[],

                backgroundColor:"#FFCC00"

            }]

        }

    }

);

function applyDateFilter(reports){

    const filter =
        document.getElementById("dateFilter").value;

    const now=Date.now();

    return reports.filter(r=>{

        const diff=now-r.timestamp;

        switch(filter){

            case "today":
                return diff<86400000;

            case "yesterday":
                return diff>=86400000 &&
                       diff<172800000;

            case "week":
                return diff<604800000;

            case "month":
                return diff<2592000000;

            case "3months":
                return diff<7776000000;

            default:
                return true;

        }

    });

}

function updateDashboard(reports){

    const warehouse =
        document.getElementById("warehouseFilter").value;

    const shift =
        document.getElementById("shiftFilter").value;

    let filtered=[...reports];

    filtered=applyDateFilter(filtered);

    if(warehouse!=="all"){

        filtered=filtered.filter(r=>
            r.warehouse===warehouse
        );

    }

    if(shift!=="all"){

        filtered=filtered.filter(r=>
            r.shift===shift
        );

    }

    let total=0;

    const incidentTotals={};

    incidents.forEach(i=>{
        incidentTotals[i]=0;
    });

    const warehouseTotals={};

    warehouses.forEach(w=>{
        warehouseTotals[w]=0;
    });

    filtered.forEach(r=>{

        total+=r.total;

        warehouseTotals[r.warehouse]+=r.total;

        r.records.forEach(rec=>{

            incidentTotals[rec.incident]+=
                rec.quantity;

        });

    });

    document.getElementById("kpiTotal")
        .innerText=total;

    document.getElementById("kpiVacaciones")
        .innerText=incidentTotals["Vacaciones"];

    document.getElementById("kpiIncapacidad")
        .innerText=incidentTotals["Incapacidad"];

    document.getElementById("kpiVacante")
        .innerText=incidentTotals["Vacante"];

    lineChart.data.datasets[0].data =
        incidents.map(i=>incidentTotals[i]);

    lineChart.update();

    barChart.data.datasets[0].data =
        warehouses.map(w=>warehouseTotals[w]);

    barChart.update();

}

function loadReports(){

    const table =
        document.getElementById("historyTable");

    onSnapshot(
        collection(db,"reports"),
        snapshot=>{

            const reports=[];

            table.innerHTML="";

            snapshot.forEach(doc=>{

                reports.push(doc.data());

            });

            reports.sort((a,b)=>
                b.timestamp-a.timestamp
            );

            reports.forEach(r=>{

                table.innerHTML += `

                    <tr>

                        <td>${r.date}</td>
                        <td>${r.username}</td>
                        <td>${r.warehouse}</td>
                        <td>${r.shift}</td>
                        <td>${r.total}</td>

                    </tr>

                `;

            });

            updateDashboard(reports);

        }
    );

}

[
    "warehouseFilter",
    "shiftFilter",
    "dateFilter"
].forEach(id=>{

    document
        .getElementById(id)
        .addEventListener("change",loadReports);

});

loadReports();

</script>

</body>
</html>
