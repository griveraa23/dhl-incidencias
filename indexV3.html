<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHL Workforce Planning V7 FIX</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --dhl-red:#D40511;
    --dhl-yellow:#FFCC00;
    --bg:#f5f5f5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--bg);
}

header{
    background:var(--dhl-yellow);
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

header h1{
    color:var(--dhl-red);
}

.datetime{
    font-weight:bold;
}

.container{
    max-width:1900px;
    margin:auto;
    padding:20px;
}

.top-buttons{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.top-buttons button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:white;
}

.top-buttons button.active{
    background:var(--dhl-red);
    color:white;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.filters select,
.filters input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
}

.quick-filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.quick-btn{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#eee;
    cursor:pointer;
    font-weight:bold;
}

.quick-btn.active{
    background:var(--dhl-red);
    color:white;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:20px;
    border-left:8px solid var(--dhl-red);
}

.kpi-number{
    font-size:38px;
    font-weight:bold;
    color:var(--dhl-red);
}

.selector-group{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin:20px 0;
}

.selector{
    padding:15px 20px;
    border-radius:15px;
    border:2px solid #ccc;
    cursor:pointer;
    background:white;
    font-weight:bold;
}

.selector.active{
    background:var(--dhl-red);
    color:white;
    border-color:var(--dhl-red);
}

.position-block{
    background:#fafafa;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.position-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.incidents-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.incident-card{
    background:white;
    padding:15px;
    border-radius:15px;
}

.counter{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin-top:12px;
}

.counter button{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.plus{
    background:var(--dhl-yellow);
}

.minus{
    background:#ffdede;
    color:var(--dhl-red);
}

.count{
    font-size:26px;
    font-weight:bold;
}

.add-position-btn{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:var(--dhl-yellow);
    cursor:pointer;
    font-weight:bold;
}

.submit-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:var(--dhl-red);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
}

.report-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table th,
.history-table td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--dhl-red);
    color:white;
    padding:15px 25px;
    border-radius:12px;
    display:none;
}

</style>

</head>

<body>

<header>

    <h1>📦 DHL Workforce Planning V7 FIX</h1>

    <div class="datetime">
        <div id="date"></div>
        <div id="time"></div>
    </div>

</header>

<div class="container">

    <div class="top-buttons">

        <button id="dashboardBtn" class="active">
            📊 Dashboard
        </button>

        <button id="reportBtn">
            📝 Programar
        </button>

    </div>

    <div id="dashboardPage" class="page active">

        <div class="card">

            <div class="filters">

                <div>
                    <label>Nave</label>
                    <select id="warehouseFilter"></select>
                </div>

                <div>
                    <label>Turno</label>
                    <select id="shiftFilter">
                        <option value="all">Todos</option>
                        <option value="Primero">Primero</option>
                        <option value="Segundo">Segundo</option>
                        <option value="Tercero">Tercero</option>
                    </select>
                </div>

                <div>
                    <label>Fecha Inicio</label>
                    <input type="date" id="startDate">
                </div>

                <div>
                    <label>Fecha Fin</label>
                    <input type="date" id="endDate">
                </div>

            </div>

        </div>

        <div class="kpis" id="dynamicKpis"></div>

        <div class="card">
            <canvas id="lineChart"></canvas>
        </div>

        <div class="card">
            <canvas id="barChart"></canvas>
        </div>

    </div>

    <div id="reportPage" class="page">

        <div class="card">

            <h2>📝 Programar</h2>

            <br>

            <label>Usuario</label>
            <input type="text" id="username">

            <br><br>

            <label>Fecha Programada</label>
            <input type="date" id="scheduledDate">

            <br><br>

            <button class="submit-btn"
                onclick="submitReport()">

                🚀 Guardar

            </button>

        </div>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBpiI6tgL25Ssrt57n_9rxZJoTa9y0KC5g",
  authDomain: "dhl-incidencias.firebaseapp.com",
  projectId: "dhl-incidencias",
  storageBucket: "dhl-incidencias.firebasestorage.app",
  messagingSenderId: "592376274380",
  appId: "1:592376274380:web:dee72b1b5c8fe5a6141169",
  measurementId: "G-L8WWCG2QMZ"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const warehouses = [
"Nave 1","Nave 4","Nave 26","Nave 52"
];

const incidents = [
"Vacante",
"Capacitación",
"Ausentismo",
"Incapacidad"
];

let reports=[];

const today = new Date();

document.getElementById("scheduledDate").value =
    today.toISOString().split("T")[0];

document.getElementById("startDate").value =
    today.toISOString().split("T")[0];

document.getElementById("endDate").value =
    today.toISOString().split("T")[0];

function updateClock(){

    const now = new Date();

    document.getElementById("date")
        .innerText = now.toLocaleDateString();

    document.getElementById("time")
        .innerText = now.toLocaleTimeString();

}

setInterval(updateClock,1000);

updateClock();

dashboardBtn.onclick=()=>{

    dashboardPage.classList.add("active");
    reportPage.classList.remove("active");

    dashboardBtn.classList.add("active");
    reportBtn.classList.remove("active");

};

reportBtn.onclick=()=>{

    reportPage.classList.add("active");
    dashboardPage.classList.remove("active");

    reportBtn.classList.add("active");
    dashboardBtn.classList.remove("active");

};

const warehouseFilter =
    document.getElementById("warehouseFilter");

warehouseFilter.innerHTML =
    `<option value="all">Todas</option>`;

warehouses.forEach(w=>{

    warehouseFilter.innerHTML += `
        <option value="${w}">
            ${w}
        </option>
    `;

});

async function submitReport(){

    const username =
        document.getElementById("username").value;

    const scheduledDate =
        document.getElementById("scheduledDate").value;

    if(username===""){
        alert("Ingresa usuario");
        return;
    }

    await addDoc(collection(db,"reports"),{

        username,
        scheduledDate,
        warehouse:"Nave 1",
        shift:"Primero",
        positions:[],
        total:1,
        timestamp:Date.now()

    });

    alert("Guardado");

}

window.submitReport=submitReport;

const lineChart=new Chart(
    document.getElementById("lineChart"),
    {
        type:"bar",
        data:{
            labels:incidents,
            datasets:[{
                data:[0,0,0,0],
                backgroundColor:"#D40511"
            }]
        }
    }
);

const barChart=new Chart(
    document.getElementById("barChart"),
    {
        type:"bar",
        data:{
            labels:warehouses,
            datasets:[{
                data:[0,0,0,0],
                backgroundColor:"#FFCC00"
            }]
        }
    }
);

function filterReports(data){

    const warehouseFilter=
        document.getElementById("warehouseFilter").value;

    const shiftFilter=
        document.getElementById("shiftFilter").value;

    const startDate=
        new Date(
            document.getElementById("startDate").value
        );

    const endDate=
        new Date(
            document.getElementById("endDate").value
        );

    endDate.setHours(23,59,59,999);

    return data.filter(r=>{

        const reportDate =
            new Date(
                r.scheduledDate + "T00:00:00"
            );

        const warehouseMatch=
            warehouseFilter==="all" ||
            r.warehouse===warehouseFilter;

        const shiftMatch=
            shiftFilter==="all" ||
            r.shift===shiftFilter;

        const dateMatch=
            reportDate >= startDate &&
            reportDate <= endDate;

        return (
            warehouseMatch &&
            shiftMatch &&
            dateMatch
        );

    });

}

function updateDashboard(data){

    const filtered =
        filterReports(data);

    const totals =
        incidents.map(()=>0);

    lineChart.data.datasets[0].data =
        totals;

    lineChart.update();

}

function loadReports(){

    onSnapshot(collection(db,"reports"),snapshot=>{

        reports=[];

        snapshot.forEach(doc=>{

            reports.push(doc.data());

        });

        updateDashboard(reports);

    });

}

document
    .getElementById("warehouseFilter")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("shiftFilter")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("startDate")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("endDate")
    .addEventListener("change",()=>updateDashboard(reports));

loadReports();

</script>

</body>
</html>
