<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHL Incidencias V4</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --dhl-red:#D40511;
    --dhl-yellow:#FFCC00;
    --bg:#f4f4f4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--bg);
}

header{
    background:var(--dhl-yellow);
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

header h1{
    color:var(--dhl-red);
}

.datetime{
    font-weight:bold;
    color:#333;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:20px;
}

.top-buttons{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.top-buttons button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:white;
}

.top-buttons button.active{
    background:var(--dhl-red);
    color:white;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.filters select,
.filters input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:20px;
    border-left:8px solid var(--dhl-red);
}

.kpi-number{
    font-size:38px;
    font-weight:bold;
    color:var(--dhl-red);
}

.selector-group{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin:20px 0;
}

.selector{
    padding:15px 20px;
    border-radius:15px;
    border:2px solid #ccc;
    cursor:pointer;
    background:white;
    font-weight:bold;
}

.selector.active{
    background:var(--dhl-red);
    color:white;
    border-color:var(--dhl-red);
}

.position-block{
    background:#fafafa;
    border:2px solid #eee;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.position-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:15px;
}

.position-title{
    font-size:20px;
    font-weight:bold;
    color:var(--dhl-red);
}

.remove-btn{
    background:#ffe5e5;
    color:var(--dhl-red);
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.incidents-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.incident-card{
    background:white;
    border-radius:15px;
    padding:15px;
}

.counter{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:12px;
}

.counter button{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.plus{
    background:var(--dhl-yellow);
}

.minus{
    background:#ffdede;
    color:var(--dhl-red);
}

.count{
    font-size:24px;
    font-weight:bold;
}

.add-position-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    background:var(--dhl-yellow);
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

.submit-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:15px;
    background:var(--dhl-red);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
}

.report-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.history-table{
    width:100%;
    border-collapse:collapse;
}

.history-table th,
.history-table td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--dhl-red);
    color:white;
    padding:15px 25px;
    border-radius:12px;
    display:none;
}

@media(max-width:900px){

    .report-layout{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <h1>📦 DHL Sistema de Incidencias V4</h1>

    <div class="datetime">
        <div id="date"></div>
        <div id="time"></div>
    </div>

</header>

<div class="container">

    <div class="top-buttons">

        <button id="dashboardBtn" class="active">
            📊 Dashboard
        </button>

        <button id="reportBtn">
            📝 Reportar
        </button>

    </div>

    <!-- DASHBOARD -->

    <div id="dashboardPage" class="page active">

        <div class="card">

            <div class="filters">

                <div>

                    <label>Nave</label>

                    <select id="warehouseFilter"></select>

                </div>

                <div>

                    <label>Turno</label>

                    <select id="shiftFilter">

                        <option value="all">Todos</option>
                        <option value="Primero">Primero</option>
                        <option value="Segundo">Segundo</option>
                        <option value="Tercero">Tercero</option>

                    </select>

                </div>

                <div>

                    <label>Periodo</label>

                    <select id="dateFilter">

                        <option value="today">Hoy</option>
                        <option value="yesterday">Ayer</option>
                        <option value="week">Esta Semana</option>
                        <option value="month">Este Mes</option>
                        <option value="3months">Últimos 3 Meses</option>

                    </select>

                </div>

            </div>

        </div>

        <div class="kpis">

            <div class="kpi">
                <h3>Total Incidencias</h3>
                <div class="kpi-number" id="kpiTotal">0</div>
            </div>

            <div class="kpi">
                <h3>Vacaciones</h3>
                <div class="kpi-number" id="kpiVacaciones">0</div>
            </div>

            <div class="kpi">
                <h3>Incapacidades</h3>
                <div class="kpi-number" id="kpiIncapacidad">0</div>
            </div>

            <div class="kpi">
                <h3>Vacantes</h3>
                <div class="kpi-number" id="kpiVacantes">0</div>
            </div>

        </div>

        <div class="card">

            <h2>📈 Incidencias</h2>

            <br>

            <canvas id="lineChart"></canvas>

        </div>

        <div class="card">

            <h2>🏭 Incidencias por Nave</h2>

            <br>

            <canvas id="barChart"></canvas>

        </div>

    </div>

    <!-- REPORTE -->

    <div id="reportPage" class="page">

        <div class="report-layout">

            <div class="card">

                <h2>📝 Captura</h2>

                <br>

                <label>Usuario</label>

                <input type="text" id="username">

                <br><br>

                <h3>Selecciona Nave</h3>

                <div class="selector-group" id="warehouseSelectors"></div>

                <h3>Selecciona Turno</h3>

                <div class="selector-group">

                    <div class="selector shift" onclick="selectShift(this,'Primero')">
                        ☀️ Primero
                    </div>

                    <div class="selector shift" onclick="selectShift(this,'Segundo')">
                        🌤 Segundo
                    </div>

                    <div class="selector shift" onclick="selectShift(this,'Tercero')">
                        🌙 Tercero
                    </div>

                </div>

                <div id="positionsContainer"></div>

                <button class="add-position-btn" onclick="addPositionBlock()">
                    ➕ Agregar Puesto
                </button>

            </div>

            <div class="card">

                <h2>🛒 Resumen</h2>

                <br>

                <div id="summary"></div>

                <button class="submit-btn" onclick="submitReport()">
                    🚀 Enviar Reporte
                </button>

            </div>

        </div>

    </div>

</div>

<div class="toast" id="toast">
    Reporte enviado correctamente
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBpiI6tgL25Ssrt57n_9rxZJoTa9y0KC5g",
  authDomain: "dhl-incidencias.firebaseapp.com",
  projectId: "dhl-incidencias",
  storageBucket: "dhl-incidencias.firebasestorage.app",
  messagingSenderId: "592376274380",
  appId: "1:592376274380:web:dee72b1b5c8fe5a6141169",
  measurementId: "G-L8WWCG2QMZ"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const warehouses = [
    "Nave 1",
    "Nave 4",
    "Nave 26",
    "Nave 52",
    "Nave 84",
    "Nave 82",
    "Nave 101",
    "Nave 109",
    "Forvia/HBPO",
    "Mtto MHE",
    "Falcon",
    "Transportes"
];

const positions = [
    "Operario Flexible",
    "Tractorista",
    "Montacarguista",
    "Gruista",
    "Analista",
    "Coordinador"
];

const incidents = [
    "Vacaciones",
    "Permiso sin goce",
    "Permiso con goce",
    "Incapacidad",
    "Capacitación",
    "Castigo",
    "Plan de fin de semana",
    "Vacante"
];

let selectedWarehouse="";
let selectedShift="";
let reports=[];

const positionsData=[];

function updateClock(){

    const now=new Date();

    document.getElementById("date").innerText=
        now.toLocaleDateString();

    document.getElementById("time").innerText=
        now.toLocaleTimeString();

}

setInterval(updateClock,1000);

updateClock();

const dashboardBtn=document.getElementById("dashboardBtn");
const reportBtn=document.getElementById("reportBtn");

dashboardBtn.onclick=()=>{

    dashboardBtn.classList.add("active");
    reportBtn.classList.remove("active");

    dashboardPage.classList.add("active");
    reportPage.classList.remove("active");

};

reportBtn.onclick=()=>{

    reportBtn.classList.add("active");
    dashboardBtn.classList.remove("active");

    reportPage.classList.add("active");
    dashboardPage.classList.remove("active");

};

function renderWarehouses(){

    const container=
        document.getElementById("warehouseSelectors");

    const filter=
        document.getElementById("warehouseFilter");

    filter.innerHTML=`<option value="all">Todas</option>`;

    warehouses.forEach(w=>{

        filter.innerHTML+=`<option value="${w}">${w}</option>`;

        container.innerHTML+=`

            <div class="selector"
                 onclick="selectWarehouse(this,'${w}')">

                ${w}

            </div>

        `;

    });

}

renderWarehouses();

function selectWarehouse(element,name){

    selectedWarehouse=name;

    document
        .querySelectorAll("#warehouseSelectors .selector")
        .forEach(el=>el.classList.remove("active"));

    element.classList.add("active");

    updateSummary();

}

window.selectWarehouse=selectWarehouse;

function selectShift(element,name){

    selectedShift=name;

    document
        .querySelectorAll(".shift")
        .forEach(el=>el.classList.remove("active"));

    element.classList.add("active");

    updateSummary();

}

window.selectShift=selectShift;

function addPositionBlock(){

    const id=Date.now();

    const data={
        id,
        position:"",
        incidents:{}
    };

    incidents.forEach(i=>{
        data.incidents[i]=0;
    });

    positionsData.push(data);

    renderPositions();

}

window.addPositionBlock=addPositionBlock;

function renderPositions(){

    const container=
        document.getElementById("positionsContainer");

    container.innerHTML="";

    positionsData.forEach(block=>{

        const div=document.createElement("div");

        div.className="position-block";

        let incidentHTML="";

        incidents.forEach(type=>{

            incidentHTML+=`

                <div class="incident-card">

                    <div>${type}</div>

                    <div class="counter">

                        <button class="minus"
                            onclick="changeCount('${block.id}','${type}',-1)">
                            -
                        </button>

                        <div class="count">
                            ${block.incidents[type]}
                        </div>

                        <button class="plus"
                            onclick="changeCount('${block.id}','${type}',1)">
                            +
                        </button>

                    </div>

                </div>

            `;

        });

        div.innerHTML=`

            <div class="position-header">

                <select onchange="changePosition('${block.id}',this.value)">

                    <option value="">Selecciona puesto</option>

                    ${positions.map(p=>`

                        <option
                            value="${p}"
                            ${block.position===p?"selected":""}
                        >
                            ${p}
                        </option>

                    `).join("")}

                </select>

                <button class="remove-btn"
                    onclick="removePosition('${block.id}')">
                    ❌ Eliminar
                </button>

            </div>

            <div class="incidents-grid">

                ${incidentHTML}

            </div>

        `;

        container.appendChild(div);

    });

    updateSummary();

}

function changePosition(id,value){

    const block=
        positionsData.find(x=>x.id==id);

    block.position=value;

    updateSummary();

}

window.changePosition=changePosition;

function changeCount(id,incident,qty){

    const block=
        positionsData.find(x=>x.id==id);

    if(block.incidents[incident]+qty>=0){

        block.incidents[incident]+=qty;

    }

    renderPositions();

}

window.changeCount=changeCount;

function removePosition(id){

    const index=
        positionsData.findIndex(x=>x.id==id);

    positionsData.splice(index,1);

    renderPositions();

}

window.removePosition=removePosition;

function updateSummary(){

    const summary=document.getElementById("summary");

    let total=0;

    let html=`

        <div class="summary-item">
            <strong>Nave</strong>
            <span>${selectedWarehouse || "-"}</span>
        </div>

        <div class="summary-item">
            <strong>Turno</strong>
            <span>${selectedShift || "-"}</span>
        </div>

    `;

    positionsData.forEach(p=>{

        let subtotal=0;

        incidents.forEach(i=>{
            subtotal+=p.incidents[i];
        });

        total+=subtotal;

        html+=`

            <div class="summary-item">
                <span>${p.position || "Sin puesto"}</span>
                <strong>${subtotal}</strong>
            </div>

        `;

    });

    html+=`

        <div class="summary-item">
            <strong>Total</strong>
            <strong>${total}</strong>
        </div>

    `;

    summary.innerHTML=html;

}

addPositionBlock();

async function submitReport(){

    const username=
        document.getElementById("username").value;

    if(username.trim()===""){
        alert("Ingresa usuario");
        return;
    }

    if(selectedWarehouse===""){
        alert("Selecciona nave");
        return;
    }

    if(selectedShift===""){
        alert("Selecciona turno");
        return;
    }

    const total=
        positionsData.reduce((acc,p)=>{

            return acc +
                Object.values(p.incidents)
                    .reduce((a,b)=>a+b,0);

        },0);

    if(total===0){
        alert("Agrega incidencias");
        return;
    }

    const now=new Date();

    await addDoc(collection(db,"reports"),{

        username,
        warehouse:selectedWarehouse,
        shift:selectedShift,
        positions:positionsData,
        total,

        date:now.toLocaleDateString(),
        time:now.toLocaleTimeString(),

        timestamp:Date.now(),

        isoDate:now.toISOString()

    });

    resetForm();

    showToast();

}

window.submitReport=submitReport;

function resetForm(){

    positionsData.length=0;

    addPositionBlock();

    selectedWarehouse="";
    selectedShift="";

    document.getElementById("username").value="";

    document
        .querySelectorAll(".selector")
        .forEach(el=>el.classList.remove("active"));

}

function showToast(){

    const toast=document.getElementById("toast");

    toast.style.display="block";

    setTimeout(()=>{
        toast.style.display="none";
    },3000);

}

const lineChart=new Chart(
    document.getElementById("lineChart"),
    {
        type:"bar",
        data:{
            labels:incidents,
            datasets:[{
                label:"Incidencias",
                data:new Array(incidents.length).fill(0),
                backgroundColor:"#D40511"
            }]
        }
    }
);

const barChart=new Chart(
    document.getElementById("barChart"),
    {
        type:"bar",
        data:{
            labels:warehouses,
            datasets:[{
                label:"Totales",
                data:new Array(warehouses.length).fill(0),
                backgroundColor:"#FFCC00"
            }]
        }
    }
);

function filterReports(data){

    const warehouseFilter=
        document.getElementById("warehouseFilter").value;

    const shiftFilter=
        document.getElementById("shiftFilter").value;

    const dateFilter=
        document.getElementById("dateFilter").value;

    let filtered=[...data];

    const today=new Date();

    filtered=filtered.filter(r=>{

        const reportDate=new Date(r.isoDate);

        const sameDay=
            reportDate.toDateString()===
            today.toDateString();

        const yesterday=new Date();
        yesterday.setDate(today.getDate()-1);

        const sameYesterday=
            reportDate.toDateString()===
            yesterday.toDateString();

        const diffDays=
            (today-reportDate)/(1000*60*60*24);

        switch(dateFilter){

            case "today":
                return sameDay;

            case "yesterday":
                return sameYesterday;

            case "week":
                return diffDays<=7;

            case "month":
                return diffDays<=30;

            case "3months":
                return diffDays<=90;

            default:
                return true;

        }

    });

    if(warehouseFilter!=="all"){

        filtered=filtered.filter(r=>
            r.warehouse===warehouseFilter
        );

    }

    if(shiftFilter!=="all"){

        filtered=filtered.filter(r=>
            r.shift===shiftFilter
        );

    }

    return filtered;

}

function updateDashboard(data){

    const filtered=
        filterReports(data);

    let total=0;

    const incidentTotals={};

    incidents.forEach(i=>{
        incidentTotals[i]=0;
    });

    const warehouseTotals={};

    warehouses.forEach(w=>{
        warehouseTotals[w]=0;
    });

    filtered.forEach(r=>{

        total+=r.total;

        warehouseTotals[r.warehouse]+=r.total;

        r.positions.forEach(p=>{

            incidents.forEach(i=>{

                incidentTotals[i]+=
                    p.incidents[i] || 0;

            });

        });

    });

    document.getElementById("kpiTotal")
        .innerText=total;

    document.getElementById("kpiVacaciones")
        .innerText=incidentTotals["Vacaciones"];

    document.getElementById("kpiIncapacidad")
        .innerText=incidentTotals["Incapacidad"];

    document.getElementById("kpiVacantes")
        .innerText=incidentTotals["Vacante"];

    lineChart.data.datasets[0].data=
        incidents.map(i=>incidentTotals[i]);

    lineChart.update();

    barChart.data.datasets[0].data=
        warehouses.map(w=>warehouseTotals[w]);

    barChart.update();

}

function loadReports(){

    onSnapshot(collection(db,"reports"),snapshot=>{

        reports=[];

        snapshot.forEach(doc=>{

            reports.push(doc.data());

        });

        updateDashboard(reports);

    });

}

document
    .getElementById("warehouseFilter")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("shiftFilter")
    .addEventListener("change",()=>updateDashboard(reports));

document
    .getElementById("dateFilter")
    .addEventListener("change",()=>updateDashboard(reports));

loadReports();

</script>

</body>
</html>
